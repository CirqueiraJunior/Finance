[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-desktop"
dynamic = ["version"]
description = "Fundação do software desktop financeiro do CESPC/GO."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1,<4",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "httpx>=0.28,<1",
    "argon2-cffi>=25,<26",
    "PyJWT>=2.10,<3",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
finance = "app.main:main"
finance-bootstrap-admin = "finance_server.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["resources/styles/*.qss", "assets/*.png", "assets/*.ico", "assets/*.md"]

[tool.setuptools.dynamic]
version = {attr = "app.core.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
qt_api = "pyside6"
